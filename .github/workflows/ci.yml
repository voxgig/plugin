# CI for plugin.
#
# At P0 there are no ports, so this is the two jobs that guard the
# contract itself: the spec artifact regenerates from its source, and the
# canonical API list is checked. Both are cheap and both are the things
# that go quietly wrong.
#
# The per-port matrix grows with the ports (P1 added typescript, P4 go;
# python next, then P5 and P6), modelled on omni's ci.yml — one job per
# port with `fail-fast: false`, so a single failing language is named in
# the UI rather than buried in a multi-language log. Each port's toolchain
# step is guarded by `if:` on the matrix value, because twenty ports
# cannot share one setup step.
#
# Action SHAs are pinned rather than floating on a tag: a tag can move, and
# a supply-chain change to a CI action is a change to everything it builds.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # spec/plugin.json is generated from spec/plugin.aontu and committed so
  # that no port needs a Node toolchain. Recompile it here and fail if the
  # committed copy differs — a corpus edit cannot land with a stale
  # artifact, which is prime directive 5 enforced rather than asked for.
  spec-freshness:
    name: spec regenerates from *.aontu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make spec
      # Not `git diff --exit-code`: that ignores untracked files, so a
      # commit adding a new spec/*.aontu without its generated JSON would
      # pass while the artifact the ports read was never committed at all.
      - name: Fail if a committed spec JSON is stale or missing
        run: |
          if [ -n "$(git status --porcelain -- spec/)" ]; then
            git status --porcelain -- spec/
            echo
            echo "spec/ is out of sync with its .aontu sources."
            echo "Run 'make spec' and commit the result."
            exit 1
          fi
      # A well-formed corpus, not just a fresh artifact: unify each source
      # with the format shape (spec/def/plugin-spec.aontu), which is itself
      # aontu. --self-test proves the shape can still go red — a shape that
      # only ever says ok is not a check.
      - name: Check spec sources against the format shape
        run: cd tools && npm run --silent check-spec-shape

  # The property that makes N ports one library rather than N lookalikes.
  parity:
    name: api parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: make parity
      # The probe catalog is a contract, not a fixture: a driver
      # section's expected `log` is written against what `noisy` does.
      - run: make probes

  # One job per port, modelled on omni's ci.yml. `fail-fast: false` so a
  # single failing language is named in the UI rather than buried in a
  # multi-language log — the whole point of a conformance suite is
  # saying WHICH port disagrees.
  port:
    name: ${{ matrix.port }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # P4, P5 and P6 are complete: every port in the repo is here.
        #
        # THIS LIST IS THE FOURTH REGISTRATION A NEW PORT NEEDS, after
        # `LANGS`, `check_parity.py` and `check_probes.py`. A port absent
        # from it is built and tested by nobody on GitHub while `make
        # check` passes locally, which is exactly the shape of the gap
        # review found in `check_probes.py`: the gate stays green
        # BECAUSE the port is missing from it.
        port: [typescript, go, python, javascript, ruby, php, perl, rust, java, lua,
               csharp, elixir, clojure, dart, kotlin, swift, scala,
               c, cpp, ocaml, haskell, zig, lean]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.port == 'typescript' || matrix.port == 'javascript'
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.port == 'python'
        with:
          python-version: '3.12'
      # NO setup-ruby, setup-php, setup-perl, setup-rust OR setup-java STEP, for the same reason
      # as go below: the ubuntu-latest image ships ruby 3.x, php 8.x and
      # perl 5.38, a rust toolchain, a JDK and a .NET SDK, none of those ports has a
      # dependency to fetch (rust's Cargo.toml has an EMPTY [dependencies],
      # which is why `make test-rust` passes --offline), and an
      # unpinned action would be the worse trade. Each port's `inspect`
      # prints the version it got, which is what makes a surprise there
      # visible rather than silent — php needs 8.1+ for `array_is_list`
      # and perl 5.36+ for `builtin::is_bool`, and both are well below
      # what the image carries.
      # NO setup-go STEP, DELIBERATELY. Every action here is pinned to a
      # SHA rather than a tag, and this workflow cannot resolve one for an
      # action it does not already use; an unpinned action would be a
      # worse trade than none. The ubuntu-latest image ships a Go
      # toolchain, `go.mod` asks only for 1.21, and the port has no
      # dependencies to fetch — so `make test-go` runs on the image's own
      # Go. `make inspect` prints the version it got, which is what makes
      # a surprise there visible rather than silent.
      # lua is the one port the image does not already carry. `apt-get`
      # rather than a setup action for the same reason as everything else
      # here: every action is pinned to a SHA, this workflow cannot resolve
      # one for an action it does not already use, and an unpinned action
      # would be a worse trade than an apt line that names its package.
      - if: matrix.port == 'lua'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      # elixir is the other one. Same apt reasoning as lua; the package
      # pulls the erlang runtime it needs, and `make inspect-elixir` prints
      # the pair it got — the port needs 1.12+ for the `..//` step range
      # and nothing newer.
      - if: matrix.port == 'elixir'
        run: sudo apt-get update && sudo apt-get install -y elixir
      # clojure likewise. The debian package is the launcher plus the
      # clojure jar and nothing else, which is all this port asks for -
      # there is no deps.edn to resolve and no leiningen to install.
      - if: matrix.port == 'clojure'
        run: sudo apt-get update && sudo apt-get install -y clojure
      # dart is not in ubuntu's archive at all, so this is the SDK zip from
      # Google's own bucket at a PINNED version rather than a floating
      # channel - the same reason every action here is pinned to a SHA. The
      # port has no pubspec and so nothing to fetch after this.
      - if: matrix.port == 'dart'
        run: |
          curl -fsSL -o /tmp/dartsdk.zip \
            https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.2/sdk/dartsdk-linux-x64-release.zip
          unzip -q /tmp/dartsdk.zip -d /opt
          echo /opt/dart-sdk/bin >> "$GITHUB_PATH"
      # kotlin is in ubuntu's archive; the package is the compiler and the
      # stdlib jar beside it, which is all the port's Makefile looks for.
      - if: matrix.port == 'kotlin'
        run: sudo apt-get update && sudo apt-get install -y kotlin
      # scala likewise. The archive carries 2.11, which is what this port is
      # written to - `make inspect-scala` prints the version it got, so a newer
      # one arriving is visible rather than silent.
      - if: matrix.port == 'scala'
        run: sudo apt-get update && sudo apt-get install -y scala
      # swift is not, so this is the release tarball from swift.org at a PINNED
      # version - the same reason every action here is pinned to a SHA. The
      # runtime libraries it needs come with it; the port has no package
      # manifest and so nothing to resolve afterwards.
      - if: matrix.port == 'swift'
        run: |
          curl -fsSL -o /tmp/swift.tar.gz \
            https://download.swift.org/swift-5.10.1-release/ubuntu2204/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-ubuntu22.04.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      # c and cpp need NO STEP AT ALL: the image ships gcc/g++ 13.3.0,
      # both ports build with `cc`/`c++` and no library beyond libc, and
      # `make inspect` prints the version each got.
      #
      # ghc and ocaml come from ubuntu's archive rather than ghcup or
      # opam, for the reason every other apt line here gives: the port
      # has nothing to resolve afterwards (haskell has no cabal file,
      # ocaml no dune project), and an unpinned installer would be a
      # worse trade than a package that names itself. 24.04 carries ghc
      # 9.4.7 and ocaml 4.14.1, which is what these ports are written
      # against; `make inspect` prints what arrived.
      - if: matrix.port == 'haskell'
        run: sudo apt-get update && sudo apt-get install -y ghc
      - if: matrix.port == 'ocaml'
        run: sudo apt-get update && sudo apt-get install -y ocaml
      # zig is not in the archive, so this is the tarball from
      # ziglang.org at a PINNED version — the same reason every action
      # here is pinned to a SHA. 0.13.0 specifically: the port's imports
      # are rooted at `zig/run.zig` because 0.13 restricts imports to the
      # root source file's directory and has no `--main-mod-path`.
      - if: matrix.port == 'zig'
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      # lean comes from a pinned GitHub RELEASE ASSET rather than
      # elan, which would fetch a toolchain this workflow cannot pin.
      # The asset is `.tar.zst`; ubuntu-latest ships zstd, and the
      # explicit `--use-compress-program` says so rather than relying on
      # tar's suffix detection.
      - if: matrix.port == 'lean'
        run: |
          curl -fsSL -o /tmp/lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.15.0/lean-4.15.0-linux.tar.zst
          sudo mkdir -p /opt/lean
          sudo tar --use-compress-program=unzstd -xf /tmp/lean.tar.zst \
            -C /opt/lean --strip-components=1
          echo /opt/lean/bin >> "$GITHUB_PATH"
      - run: make build-${{ matrix.port }}
      - run: make test-${{ matrix.port }}
      - run: make inspect-${{ matrix.port }}
