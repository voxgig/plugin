# CI for plugin.
#
# At P0 there are no ports, so this is the two jobs that guard the
# contract itself: the spec artifact regenerates from its source, and the
# canonical API list is checked. Both are cheap and both are the things
# that go quietly wrong.
#
# The per-port matrix grows with the ports (P1 added typescript, P4 go;
# python next, then P5 and P6), modelled on omni's ci.yml — one job per
# port with `fail-fast: false`, so a single failing language is named in
# the UI rather than buried in a multi-language log. Each port's toolchain
# step is guarded by `if:` on the matrix value, because twenty ports
# cannot share one setup step.
#
# Action SHAs are pinned rather than floating on a tag: a tag can move, and
# a supply-chain change to a CI action is a change to everything it builds.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # spec/plugin.json is generated from spec/plugin.aontu and committed so
  # that no port needs a Node toolchain. Recompile it here and fail if the
  # committed copy differs — a corpus edit cannot land with a stale
  # artifact, which is prime directive 5 enforced rather than asked for.
  spec-freshness:
    name: spec regenerates from *.aontu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make spec
      # Not `git diff --exit-code`: that ignores untracked files, so a
      # commit adding a new spec/*.aontu without its generated JSON would
      # pass while the artifact the ports read was never committed at all.
      - name: Fail if a committed spec JSON is stale or missing
        run: |
          if [ -n "$(git status --porcelain -- spec/)" ]; then
            git status --porcelain -- spec/
            echo
            echo "spec/ is out of sync with its .aontu sources."
            echo "Run 'make spec' and commit the result."
            exit 1
          fi
      # A well-formed corpus, not just a fresh artifact: unify each source
      # with the format shape (spec/def/plugin-spec.aontu), which is itself
      # aontu. --self-test proves the shape can still go red — a shape that
      # only ever says ok is not a check.
      - name: Check spec sources against the format shape
        run: cd tools && npm run --silent check-spec-shape

  # The property that makes N ports one library rather than N lookalikes.
  parity:
    name: api parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: make parity
      # The probe catalog is a contract, not a fixture: a driver
      # section's expected `log` is written against what `noisy` does.
      - run: make probes

  # One job per port, modelled on omni's ci.yml. `fail-fast: false` so a
  # single failing language is named in the UI rather than buried in a
  # multi-language log — the whole point of a conformance suite is
  # saying WHICH port disagrees.
  port:
    name: ${{ matrix.port }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # P4 is complete; P5 is under way. P6 adds the rest.
        port: [typescript, go, python, javascript, ruby, php, perl, rust, java, lua,
               csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.port == 'typescript' || matrix.port == 'javascript'
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.port == 'python'
        with:
          python-version: '3.12'
      # NO setup-ruby, setup-php, setup-perl, setup-rust OR setup-java STEP, for the same reason
      # as go below: the ubuntu-latest image ships ruby 3.x, php 8.x and
      # perl 5.38, a rust toolchain, a JDK and a .NET SDK, none of those ports has a
      # dependency to fetch (rust's Cargo.toml has an EMPTY [dependencies],
      # which is why `make test-rust` passes --offline), and an
      # unpinned action would be the worse trade. Each port's `inspect`
      # prints the version it got, which is what makes a surprise there
      # visible rather than silent — php needs 8.1+ for `array_is_list`
      # and perl 5.36+ for `builtin::is_bool`, and both are well below
      # what the image carries.
      # NO setup-go STEP, DELIBERATELY. Every action here is pinned to a
      # SHA rather than a tag, and this workflow cannot resolve one for an
      # action it does not already use; an unpinned action would be a
      # worse trade than none. The ubuntu-latest image ships a Go
      # toolchain, `go.mod` asks only for 1.21, and the port has no
      # dependencies to fetch — so `make test-go` runs on the image's own
      # Go. `make inspect` prints the version it got, which is what makes
      # a surprise there visible rather than silent.
      # lua is the one port the image does not already carry. `apt-get`
      # rather than a setup action for the same reason as everything else
      # here: every action is pinned to a SHA, this workflow cannot resolve
      # one for an action it does not already use, and an unpinned action
      # would be a worse trade than an apt line that names its package.
      - if: matrix.port == 'lua'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: make build-${{ matrix.port }}
      - run: make test-${{ matrix.port }}
      - run: make inspect-${{ matrix.port }}
