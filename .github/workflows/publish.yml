# Publish the canonical typescript port to npm as `@voxgig/plugin`.
#
# NO TOKEN. Authentication is npm TRUSTED PUBLISHING: the `id-token: write`
# permission lets the job mint a short-lived OIDC token, npm verifies it
# against the trusted publisher configured for the package, and nothing
# long-lived is ever stored in the repository. A leaked secret cannot
# publish this package because there is no secret.
#
# THE ONE-TIME BOOTSTRAP. npm cannot do a package's FIRST publish over
# OIDC — a trusted publisher is configured on an existing package's
# settings page, and a package that has never been published has no
# settings page. (PyPI allows pre-registration; npm does not.) So the
# first `@voxgig/plugin` release is published once by hand with a granular
# access token, the trusted publisher is configured against this file, and
# every release after that runs here. `typescript/AGENTS.md` records the
# whole sequence.
#
# Action SHAs are pinned rather than floating on a tag, for the reason
# ci.yml gives: a tag can move, and a supply-chain change to a CI action is
# a change to everything it builds.

name: publish

on:
  # `typescript-` prefixed, not a bare `v*`: this repository holds
  # seventeen ports and only one of them is an npm package. The next
  # ecosystem gets its own prefix rather than fighting over the tag space.
  push:
    tags: ['typescript-v*']
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Build, test and pack, but do not publish'
        type: boolean
        default: false

# KEYED ON THE REF, not a single static group. GitHub allows one running
# and one pending run per group, and a newly queued run CANCELS the
# pending one — so with a static group, three releases in quick
# succession silently drop the middle version. Two different versions
# publishing at once is harmless; two runs of the SAME tag is the only
# real hazard, and that is exactly what keying on the ref still serializes.
concurrency:
  group: publish-typescript-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish @voxgig/plugin to npm
    # A GitHub-HOSTED runner, not self-hosted: provenance generation is
    # only supported on hosted runners.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Reads ci.yml's conclusion for this SHA, below.
      actions: read
      # The whole point. Without this the OIDC token cannot be minted and
      # the publish falls back to looking for a token that does not exist.
      id-token: write

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The main-ancestry check below walks history; a depth-1 clone
          # has none to walk.
          fetch-depth: 0

      # DELIBERATELY NO `registry-url`. Setting it makes setup-node write an
      # .npmrc carrying `_authToken=${NODE_AUTH_TOKEN}`; with no token in
      # the environment that line resolves to an empty credential and npm
      # can fail auth before it ever tries OIDC. The default registry is
      # already registry.npmjs.org, so the option buys nothing here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14.0. Node 24
      # satisfies the second and ships a recent npm, but "ships a recent
      # npm" is a moving target, so upgrade and then ASSERT — a silent
      # downgrade would fail later with an auth error that says nothing
      # about the version.
      - name: npm >= 11.5.1
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          node -e '
            const need = [11, 5, 1]
            const raw = process.argv[1]
            const have = raw.split("-")[0].split(".").map(Number)
            for (let i = 0; i < 3; i++) {
              if (have[i] > need[i]) process.exit(0)
              if (have[i] < need[i]) {
                console.error("npm " + raw + " is older than 11.5.1, which trusted publishing requires")
                process.exit(1)
              }
            }
          ' "$(npm --version)"

      - name: install
        run: npm ci

      # BUILD IS ITS OWN STEP. `npm test` runs the compiled suite and does
      # not build first — matching struct's script set — so a workflow that
      # skipped this would test whatever `dist` happened to contain, which
      # after a fresh `npm ci` is nothing.
      - name: build
        run: npm run build

      # The corpus gates the release: all 539 entries. A port that cannot
      # pass its own contract does not ship.
      - name: test
        run: npm test

      # THE TAG ALONE PROVES NOTHING ABOUT THE OTHER SIXTEEN PORTS. A tag
      # can be pushed at any commit, ci.yml does not run on tags, and the
      # `npm test` above is this one port — so a commit where typescript
      # and the corpus agree but propagation broke elsewhere would sail
      # through and publish.
      #
      # TWO CONDITIONS, because either alone is a hole. Ancestry of main
      # says the commit went through review; it does NOT say CI passed,
      # since `repo-tag` pushes the branch and the tag seconds apart and
      # this job would happily race the matrix — or outrun a matrix that
      # goes on to fail. So the run itself is looked up, by SHA, and must
      # have COMPLETED and SUCCEEDED. Not guarded on `refs/tags/` either:
      # a `workflow_dispatch` publish needs the same proof.
      - name: full CI must have passed on this commit
        if: ${{ !inputs.dryrun }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FETCH_HEAD, not origin/main: on a TAG checkout the action's
          # refspec need not create a remote-tracking branch ref, but the
          # fetch on the line above always sets FETCH_HEAD.
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_SHA is not on main. Publish a commit main contains." >&2
            exit 1
          fi
          echo "$GITHUB_SHA is on main; waiting for ci.yml to conclude on it"

          deadline=$(( SECONDS + 1800 ))
          while :; do
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == ".github/workflows/ci.yml")]
                    | sort_by(.run_started_at) | last // {}')
            status=$(printf '%s' "$run" | jq -r '.status // "missing"')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')

            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "ci.yml succeeded on $GITHUB_SHA"
                break
              fi
              echo "ci.yml concluded '$conclusion' on $GITHUB_SHA — not publishing" >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "gave up waiting for ci.yml on $GITHUB_SHA (last status: $status)" >&2
              exit 1
            fi
            echo "  ci.yml is '$status' — waiting"
            sleep 20
          done

      # The name this release is tagged with, resolved ONCE from the
      # manifest in the commit that was just built and tested. Both the
      # guard below and the `tag` job read it, so a dispatch release and a
      # tag push cannot disagree about what the tag should be called.
      - name: Resolve the release tag
        id: resolve
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=typescript-v$version" >> "$GITHUB_OUTPUT"

      # On a tag, the tag and the manifest must agree. They drift the moment
      # someone tags before bumping, and the failure mode without this check
      # is a published version nobody can find by tag.
      - name: tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MANIFEST: ${{ steps.resolve.outputs.version }}
        run: |
          tagged="${GITHUB_REF_NAME#typescript-v}"
          if [ "$tagged" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, package.json says $MANIFEST" >&2
            exit 1
          fi
          echo "publishing $MANIFEST"

      - name: pack (dry run)
        if: inputs.dryrun
        run: npm publish --provenance --dry-run

      # `--provenance` is passed explicitly even though trusted publishing
      # is documented to enable it by default: reports of it NOT being
      # applied are common enough, and an unsigned release is not worth the
      # saved flag. It needs `repository` in package.json to match this
      # repo, which is why that field is not optional decoration.
      #
      # `access` is public via package.json's publishConfig, so it holds
      # for the by-hand bootstrap publish too rather than living only here.
      #
      # The failure to expect here is `ENEEDAUTH`, and npm's own advice for
      # it — "authorize this machine using `npm login`" — is exactly the
      # wrong move: a token on this runner is the thing trusted publishing
      # removes. It means the OIDC token was minted and npm found no
      # trusted publisher registered for the package, so the message says
      # that instead of leaving the next person to follow npm's.
      - name: publish
        if: ${{ !inputs.dryrun }}
        run: |
          if ! npm publish --provenance; then
            echo "::error title=npm publish failed::If the error above is \
          ENEEDAUTH, no npm token is missing - the trusted publisher is not \
          registered. Set it at npmjs.com > @voxgig/plugin > Settings > \
          Trusted Publisher: GitHub Actions, organization voxgig, repository \
          plugin, workflow publish.yml. Do NOT add an npm token to this repo."
            exit 1
          fi

  # THE TAG A DISPATCH RELEASE NEVER GOT. On a `typescript-v*` push the tag
  # is what triggered the run and already exists; on a `workflow_dispatch`
  # nothing creates it — so the version reaches npm and is unfindable by tag
  # in git. This has already happened twice: tags exist for 0.1.0, 0.1.1 and
  # 0.1.2, while 0.1.3 and 0.1.4 are both on npm with no tag at all.
  #
  # Mirrors omni's release.yml `tag` job. Its `needs.publish.result ==
  # 'skipped'` allowance is deliberately NOT copied: omni skips its publish
  # job when the version is already on npm, whereas here publish is one job
  # that either ran or did not, and a skipped one means nothing shipped.
  tag:
    name: tag
    needs: [publish]
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && !inputs.dryrun
          && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH. `--verify` only asks whether the name
          # resolves; a tag created between the publish and this checkout
          # could point anywhere. Treating that as idempotent would leave a
          # green run with a package built from THIS commit and a release
          # tag on a different one.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here - nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
